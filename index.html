<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carta TV | Rompe el Hielo</title>
<style>
:root{color-scheme:dark;--gold:#d4af37;--seg:6s}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#f2ece0;font-family:Georgia,serif;overflow:hidden}

/* Fondo: collage de fotos */
#collage{position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));background:#000}
#collage .c{overflow:hidden;position:relative}
#collage img{width:100%;height:100%;object-fit:cover;display:block;animation:resp 16s ease-in-out infinite alternate}
#collage::after{content:"";position:absolute;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.62)}
@keyframes resp{from{transform:scale(1)}to{transform:scale(1.08)}}

#tablero{position:relative;z-index:1;height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 28vw;grid-template-rows:10vh minmax(0,1fr) 9vh;gap:2vh 2.5vw;padding:3vh 2.5vw}
#marca{grid-column:1;grid-row:1;display:flex;align-items:center;gap:1.6vw;min-width:0}
.logo{width:10vh;height:10vh;border-radius:50%;overflow:hidden;box-shadow:0 0 3vh rgba(212,175,55,.5)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
#marca b{white-space:nowrap;font-weight:normal;color:var(--gold);font-size:4.4vh;letter-spacing:.8vh;text-transform:uppercase}
#sonido{margin-left:auto;min-width:0;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 2.1vh system-ui,sans-serif;color:var(--gold);border:.25vh solid var(--gold);background:rgba(0,0,0,.6);padding:1vh 1.4vw;border-radius:5vh;transition:opacity .8s;animation:late 2.2s ease-in-out infinite}
#sonido.ok{animation:none}
#sonido.fuera{opacity:0}
@keyframes late{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* La tarjeta del país */
#card{grid-column:1;grid-row:2;position:relative;border-radius:2.5vh;overflow:hidden;border:.3vh solid rgba(212,175,55,.85);background:#111;box-shadow:0 1.5vh 5vh rgba(0,0,0,.6);min-height:0}
.foto{position:absolute;left:0;top:0;width:100%;height:100%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s}
.foto.on{opacity:1;animation:zoom 9s ease-out forwards}
.foto.cont{background-size:contain;background-repeat:no-repeat;background-position:right 5vh center}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.12)}}
#gran{position:absolute;right:-4vh;top:50%;width:74vh;height:49vh;margin-top:-24vh;opacity:0;transform:rotate(-7deg);transition:opacity .8s}
#gran.on{opacity:.3}
#tinte{position:absolute;left:0;top:0;width:100%;height:100%}
#bandera{position:absolute;left:3.2vh;top:3.2vh;width:21vh;height:14vh;border-radius:1.2vh;overflow:hidden;border:.3vh solid rgba(255,255,255,.9);box-shadow:0 1vh 3vh rgba(0,0,0,.65);animation:ondea 5s ease-in-out infinite}
#bandera.casa{width:14vh;border-radius:50%;border-color:var(--gold)}
#bandera img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes ondea{0%,100%{transform:perspective(70vh) rotateY(-9deg)}50%{transform:perspective(70vh) rotateY(9deg)}}
#origen{position:absolute;left:28vh;top:4.2vh;right:3vh}
#origen small{display:block;font:600 2.4vh system-ui,sans-serif;letter-spacing:.7vh;text-transform:uppercase;color:var(--gold);text-shadow:0 .3vh 1.2vh rgba(0,0,0,.8)}
#origen b{display:block;font-weight:normal;font-size:5.4vh;line-height:1.1;margin-top:.8vh;color:#fff;text-shadow:0 .4vh 2vh rgba(0,0,0,.85)}
#abajo{position:absolute;left:3.2vh;right:3.2vh;bottom:4.2vh}
#dTag{display:inline-block;background:var(--gold);color:#111;font:700 2.6vh system-ui,sans-serif;letter-spacing:.3vh;text-transform:uppercase;padding:.8vh 1.6vw;border-radius:5vh;margin-bottom:1.6vh;visibility:hidden}
#dNombre{font-size:14vh;line-height:1;color:#fff6dc;text-shadow:0 .8vh 3.5vh rgba(0,0,0,.9)}
#dIng{margin-top:2vh;font:600 3.6vh system-ui,sans-serif;color:#f6ecd0;letter-spacing:.2vh;text-shadow:0 .4vh 1.6vh rgba(0,0,0,.9)}
#progreso{position:absolute;left:0;bottom:0;width:100%;height:.9vh;background:rgba(255,255,255,.2)}
#barra{height:100%;background:var(--gold);transform-origin:left;transform:scaleX(0)}
#barra.corre{animation:llenar var(--seg) linear forwards}
.sube{animation:sube .7s ease-out both}
.sube2{animation:sube .7s .15s ease-out both}
.sube3{animation:sube .7s .3s ease-out both}
@keyframes sube{0%{transform:translateY(4vh);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes llenar{to{transform:scaleX(1)}}

/* La carta completa, a la derecha */
#lista{grid-column:2;grid-row:1 / 3;background:rgba(8,8,8,.62);border:.2vh solid rgba(212,175,55,.7);border-radius:2vh;padding:2vh 1.2vw;display:flex;flex-direction:column;min-height:0;}
#lista h3{margin:0 0 1.2vh;color:var(--gold);font-weight:normal;font-size:2.8vh;letter-spacing:.4vh;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;white-space:nowrap}
#lista h3 small{font:1.8vh system-ui,sans-serif;color:#d7ccb4;letter-spacing:0;text-transform:none}
#items{flex:1;display:grid;gap:.5vh;min-height:0}
.it{display:flex;align-items:center;padding:0 1vw;border-radius:1.2vh;font-size:3.2vh;border-left:.6vh solid transparent;white-space:nowrap;overflow:hidden;min-width:0}
.it.act{background:rgba(212,175,55,.22);border-left-color:var(--gold);color:var(--gold)}
.st{color:var(--gold);margin-right:.5vw}
.it .mini{margin-left:auto;flex:none;width:5vh;height:3.3vh;border-radius:.5vh;overflow:hidden;border:.15vh solid rgba(255,255,255,.7)}

/* Abajo: bebidas sin alcohol */
#pie{grid-column:1 / 3;grid-row:3;background:rgba(0,0,0,.65);border-radius:1.5vh;display:flex;align-items:center;overflow:hidden;font-size:3vh;padding:0 2vw}
#cinta{flex:1;overflow:hidden;white-space:nowrap}
#pista{display:inline-block;animation:cinta 30s linear infinite}
@keyframes cinta{to{transform:translateX(-50%)}}
#pista b{color:var(--gold);font-weight:normal;text-transform:uppercase;letter-spacing:.3vh}

#ig{position:fixed;left:0;top:0;width:100%;height:100%;background:#000;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;opacity:0;pointer-events:none;transition:opacity .6s}
#ig.on{opacity:1}
#ig #igLogo{height:16vh;width:16vh;border-radius:50%}
#ig h2{margin:0;color:var(--gold);font-weight:normal;font-size:6vh;letter-spacing:.4vh;text-transform:uppercase}
#ig .qr{background:#fff;padding:2vh;border-radius:2vh}
#ig .qr img{height:48vh;width:48vh;display:block;image-rendering:pixelated}
#ig p{margin:0;color:#e8dfc9;font-size:3.8vh;font-family:system-ui,sans-serif}
.liviano #collage img,.liviano .foto.on,.liviano #bandera,.liviano #sonido{animation:none}
</style>
</head>

});

var IMG = {}, PEND = {};
function fotoLugar(term, cb){
  if (!term) { cb(null); return; }
  if (IMG[term] !== undefined) { cb(IMG[term]); return; }
  if (PEND[term]) { PEND[term].push(cb); return; }
  PEND[term] = [cb];
  function listo(u){
    function fin(v){ IMG[term] = v; var cbs = PEND[term]; delete PEND[term]; cbs.forEach(function(f){ f(v); }); }
    if (!u) { fin(null); return; }
    var pre = new Image();
    pre.onload = function(){ fin(pre.naturalWidth >= 800 && pre.naturalWidth / pre.naturalHeight >= 1.2 ? u : null); };
    pre.onerror = function(){ fin(null); };
    pre.src = u;
  }
  var url = "https://es.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=" + encodeURIComponent(term) + "&gsrlimit=5&prop=pageimages&piprop=thumbnail&pithumbsize=1400&format=json&origin=*";
  fetch(url).then(function(r){ return r.json(); }).then(function(j){
    var ps = (j.query && j.query.pages) ? Object.keys(j.query.pages).map(function(id){ return j.query.pages[id]; }) : [];

TRAGOS.forEach(function(t){ fotoLugar(t[4], function(){}); });

// ===== MÚSICA Y SONIDOS DE CADA PAÍS =====
// Se activa con un toque en la pantalla (o apretando cualquier tecla). Tecla M: silenciar / activar.
// Si querés usar música propia, poné en la carpeta "musica" archivos llamados cuba.mp3, brasil.mp3,
// italia.mp3, argentina.mp3, eeuu.mp3 o casa.mp3: si existen se usan; si no, suena una versión sintetizada.
var SONIDO = {on: false, ctx: null, master: null, ruido: null, pais: null, patron: null, paso: 0, sig: 0, mute: false, arch: {}, audios: {}, vol: 0.8};
function hz(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function envolvente(g, t, a, d, v){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
function tono(t, f, tipo, a, d, v, f2, filtro){
  var cx = SONIDO.ctx, o = cx.createOscillator(), g = cx.createGain(), nodo = o;
  o.type = tipo; o.frequency.setValueAtTime(f, t);
  if (f2) { o.frequency.exponentialRampToValueAtTime(f2, t + a + d); }
  if (filtro) { var fi = cx.createBiquadFilter(); fi.type = "lowpass"; fi.frequency.value = filtro; o.connect(fi); nodo = fi; }
  nodo.connect(g); g.connect(SONIDO.master); envolvente(g, t, a, d, v);
  o.start(t); o.stop(t + a + d + 0.05);
}
function ruidoSuave(t, d, v, tipo, f){
  var cx = SONIDO.ctx, s = cx.createBufferSource(), fi = cx.createBiquadFilter(), g = cx.createGain();
  s.buffer = SONIDO.ruido; fi.type = tipo; fi.frequency.value = f;
  s.connect(fi); fi.connect(g); g.connect(SONIDO.master); envolvente(g, t, 0.003, d, v);

}
var V = {
  bombo:  function(t, v){ tono(t, 120, "sine", 0.002, 0.2, v || 0.7, 42); },
  surdo:  function(t, v){ tono(t, 95, "sine", 0.003, 0.3, v || 0.6, 52); },
  conga:  function(t, f, v){ tono(t, f, "sine", 0.002, 0.15, v || 0.35, f * 0.78); },
  clave:  function(t, v){ tono(t, 2500, "triangle", 0.001, 0.05, v || 0.22); },
  shaker: function(t, v){ ruidoSuave(t, 0.05, v || 0.1, "highpass", 6500); },
  hat:    function(t, v){ ruidoSuave(t, 0.045, v || 0.1, "highpass", 8500); },
  caja:   function(t, v){ ruidoSuave(t, 0.13, v || 0.2, "bandpass", 1900); tono(t, 190, "triangle", 0.001, 0.08, 0.12); },
  bajo:   function(t, m, d, v){ tono(t, hz(m), "triangle", 0.012, d || 0.25, v || 0.5, 0, 520); },
  pluck:  function(t, m, v){ tono(t, hz(m), "triangle", 0.003, 0.4, v || 0.2, 0, 3200); },
  mandolina: function(t, m, v){ tono(t, hz(m), "triangle", 0.002, 0.14, v || 0.14, 0, 4200); },
  fuelle: function(t, m, d, v){ tono(t, hz(m), "sawtooth", 0.09, d, v || 0.05, 0, 1500); tono(t, hz(m) * 1.004, "sawtooth", 0.09, d, v || 0.05, 0, 1500); },
  acorde: function(t, notas, v){ for (var q = 0; q < notas.length; q++) { tono(t + q * 0.012, hz(notas[q]), "triangle", 0.004, 0.5, v || 0.1, 0, 2600); } }
};
function en(lista, s){ return lista.indexOf(s) >= 0; }
var PAT = {
  // Cuba: clave de son 3-2, conga, bajo "tumbao" y montuno
  cuba: {n: 16, dur: 0.15, f: function(s, t, c){
    var ac = [[57,60,64],[62,65,69],[56,59,62],[57,60,64]], rz = [45,38,40,45], k = c % 4;
    if (en([0,3,6,10,12], s)) { V.clave(t); }
    if (s % 2 === 0) { V.shaker(t, s % 4 === 0 ? 0.1 : 0.06); }
    if (s === 4 || s === 12) { V.conga(t, 230, 0.32); }
    if (s === 6 || s === 14) { V.conga(t, 170, 0.26); }
    if (s === 6 || s === 12) { V.bajo(t, rz[k] + (s === 12 ? 7 : 0), 0.28, 0.5); }
    var arp = [0,1,2,1,2,1], pos = [0,3,6,8,11,14].indexOf(s);
    if (pos >= 0) { V.pluck(t, ac[k][arp[pos]] + 12, 0.17); }
  }},
  // Brasil: samba (surdo, ganzá, tamborim) con acordes de bossa
  brasil: {n: 16, dur: 0.125, f: function(s, t, c){
    var ac = [[62,65,69,72],[55,59,62,65],[60,64,67,71],[55,59,62,65]], rz = [38,43,36,43], k = c % 4;
    if (s === 0) { V.surdo(t, 0.45); }
    if (s === 8) { V.surdo(t, 0.75); }
    V.shaker(t, [0.13, 0.05, 0.09, 0.05][s % 4]);
    if (en([0,3,6,10,12], s)) { V.clave(t, 0.1); }
    if (s === 0 || s === 8) { V.bajo(t, rz[k], 0.3, 0.45); }
    if (en([0,3,6,8,11,14], s)) { V.acorde(t, ac[k], 0.085); }
  }},
  // Italia: tarantela con mandolina en trémolo y pandereta (dos compases de 6/8)
  italia: {n: 12, dur: 0.19, f: function(s, t, c){
    var mel = [69,72,76,72,74,72, 71,69,68,69,64,69], p = s % 6, bar = s < 6 ? 0 : 1;
    for (var j = 0; j < 3; j++) { V.mandolina(t + j * 0.19 / 3, mel[s], 0.11); }
    if (p === 0) { V.bajo(t, bar ? 40 : 45, 0.35, 0.5); }
    if (p === 3) { V.bajo(t, bar ? 47 : 52, 0.3, 0.4); }
    V.shaker(t, p === 0 ? 0.14 : (p === 3 ? 0.1 : 0.05));
    if (p === 0 || p === 3) { V.conga(t, 300, 0.12); }
  }},
  // Argentina: milonga (3-3-2), bombo, guitarra y fueye
  argentina: {n: 16, dur: 0.17, f: function(s, t, c){
    var k = c % 2, rz = [38, 45], ac = [[62,65,69],[61,64,69]];
    if (en([0,3,6,8,11,14], s)) { V.conga(t, 105, 0.4); V.bajo(t, rz[k] + (s === 6 || s === 14 ? 7 : 0), 0.28, 0.4); }
    if (en([2,5,10,13], s)) { V.shaker(t, 0.1); }
    if (s === 0 || s === 8) { V.acorde(t, ac[k], 0.12); }
    var mel = k === 0 ? {0: [62, 8], 8: [65, 4], 12: [64, 4]} : {0: [61, 8], 8: [64, 4], 12: [62, 4]};
    if (mel[s]) { V.fuelle(t, mel[s][0], mel[s][1] * 0.17, 0.05); }
  }},
  // Estados Unidos: swing de Nueva Orleans (ride, bajo caminante, acordes)
  eeuu: {n: 12, dur: 0.1667, f: function(s, t, c){
    var walk = [[36,40,43,45],[41,45,48,46],[36,40,43,40],[43,41,40,38]], w = walk[c % 4];
    if (en([0,3,5,6,9,11], s)) { V.hat(t, s % 3 === 0 ? 0.11 : 0.07); }
    if (s % 3 === 0) { V.bajo(t, w[s / 3], 0.3, 0.55); }
    if (s === 0 || s === 6) { V.bombo(t, 0.3); }
    if (s === 3 || s === 9) { V.caja(t, 0.14); V.acorde(t, [64,67,70,72], 0.1); }
  }},
  // Especial de la casa: ritmo suave de bar (lounge)
  casa: {n: 16, dur: 0.136, f: function(s, t, c){
    var rz = [45,41,48,43], ac = [[57,60,64],[53,57,60],[60,64,67],[55,59,62]], k = c % 4;
    if (s % 4 === 0) { V.bombo(t, 0.45); }
    if (s % 4 === 2) { V.hat(t, 0.08); }
    if (s === 4 || s === 12) { V.caja(t, 0.1); }
    if (s === 0) { V.bajo(t, rz[k], 0.5, 0.5); }
    if (s % 2 === 0) { V.pluck(t, ac[k][(s / 2) % 3] + 12, 0.14); }
  }}
};
function aviso(txt, fijo){
  var e = $("sonido"); e.textContent = txt; e.className = "ok";
  clearTimeout(e._h); if (!fijo) { e._h = setTimeout(function(){ e.className = "ok fuera"; }, 5000); }
}
function fundir(a, v){
  clearInterval(a._f);
  a._f = setInterval(function(){
    var d = v - a.volume;
    if (Math.abs(d) < 0.06) { a.volume = v; clearInterval(a._f); if (v === 0) { a.pause(); } }
    else { a.volume = Math.max(0, Math.min(1, a.volume + (d > 0 ? 0.05 : -0.05))); }
  }, 60);
}
function sonidoTick(){
  var S = SONIDO;
  if (!S.ctx || !S.patron) { return; }
  while (S.sig < S.ctx.currentTime + 0.15) {
    var p = S.patron, s = S.paso % p.n, c = Math.floor(S.paso / p.n);
    p.f(s, S.sig, c);
    S.sig += p.dur; S.paso++;
  }
}
function sonidoCambio(p){
  var S = SONIDO, cx = S.ctx, ahora = cx.currentTime;
  S.master.gain.cancelScheduledValues(ahora);
  S.master.gain.setValueAtTime(S.master.gain.value, ahora);
  S.master.gain.linearRampToValueAtTime(0, ahora + 0.5);
  Object.keys(S.audios).forEach(function(k){ fundir(S.audios[k], 0); });
  setTimeout(function(){
    if (S.pais !== p) { return; }
    var a = S.audios[p], t = cx.currentTime;
    if (S.arch[p] === true) {
      S.patron = null;
      try { a.play(); } catch (e) {}
      fundir(a, S.mute ? 0 : 1);
    } else {
      S.patron = PAT[p]; S.paso = 0; S.sig = t + 0.05;
      S.master.gain.cancelScheduledValues(t);
      S.master.gain.setValueAtTime(0, t);
      S.master.gain.linearRampToValueAtTime(S.mute ? 0 : S.vol, t + 1);
    }
  }, 520);
}
function sonidoPais(p){
  if (SONIDO.pais === p) { return; }
  SONIDO.pais = p;
  if (SONIDO.on) { sonidoCambio(p); }
}
function sonidoIniciar(){
  var S = SONIDO;
  if (S.on) { return; }
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { aviso("Este navegador no tiene sonido"); return; }
  var cx = new AC();
  if (cx.state === "suspended" && cx.resume) { cx.resume(); }
  S.ctx = cx; S.master = cx.createGain(); S.master.gain.value = 0; S.master.connect(cx.destination);
  var largo = cx.sampleRate, buf = cx.createBuffer(1, largo, cx.sampleRate), d = buf.getChannelData(0);
  for (var q = 0; q < largo; q++) { d[q] = Math.random() * 2 - 1; }
  S.ruido = buf;
  Object.keys(PAISES).forEach(function(k){
    var a = new Audio("musica/" + k + ".mp3");
    a.loop = true; a.volume = 0; a.preload = "auto";
    a.addEventListener("canplaythrough", function(){ S.arch[k] = true; });
    a.addEventListener("error", function(){ S.arch[k] = false; });

}
function sonidoMute(){
  var S = SONIDO;
  if (!S.on) { return; }
  S.mute = !S.mute;
  var t = S.ctx.currentTime;
  S.master.gain.cancelScheduledValues(t);
  S.master.gain.setValueAtTime(S.master.gain.value, t);
  S.master.gain.linearRampToValueAtTime(S.mute || !S.patron ? 0 : S.vol, t + 0.3);
  var a = S.audios[S.pais];
  if (a && S.arch[S.pais] === true) { fundir(a, S.mute ? 0 : 1); }

// Modo liviano: si la tele o el aparato va lento, se apagan los movimientos pesados (también con ?liviano en el link)
(function(){
  if (/liviano/.test(location.search)) { document.body.classList.add("liviano"); return; }
  var n = 0, t0 = 0;
  function f(ts){
    if (!t0) { t0 = ts; }
    n++;
    if (ts - t0 < 3000) { requestAnimationFrame(f); }
    else if (n / ((ts - t0) / 1000) < 35) { document.body.classList.add("liviano"); }
  }
  setTimeout(function(){ requestAnimationFrame(f); }, 1500);
})();
